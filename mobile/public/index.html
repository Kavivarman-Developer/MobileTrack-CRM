<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Kadai Kanakku</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet" />

    <style id="expo-reset">
      /* Root element full-height */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: 'Inter', 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #F8F9FC;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Expo Google Fonts and Vector Icons font-family aliases for web */
      @font-face {
        font-family: 'Inter_400Regular';
        src: local('Inter Regular'), local('Inter-Regular'), local('Inter');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter_500Medium';
        src: local('Inter Medium'), local('Inter-Medium'), local('Inter');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter_600SemiBold';
        src: local('Inter SemiBold'), local('Inter-SemiBold'), local('Inter');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter_700Bold';
        src: local('Inter Bold'), local('Inter-Bold'), local('Inter');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'NunitoSans_400Regular';
        src: local('Nunito Sans Regular'), local('NunitoSans-Regular'), local('Nunito Sans');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'NunitoSans_600SemiBold';
        src: local('Nunito Sans SemiBold'), local('NunitoSans-SemiBold'), local('Nunito Sans');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: 'NunitoSans_700Bold';
        src: local('Nunito Sans Bold'), local('NunitoSans-Bold'), local('Nunito Sans');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'NunitoSans_800ExtraBold';
        src: local('Nunito Sans ExtraBold'), local('NunitoSans-ExtraBold'), local('Nunito Sans');
        font-weight: 800;
        font-display: swap;
      }
      @font-face {
        font-family: 'ionicons';
        src: url('https://cdn.jsdelivr.net/npm/ionicons@7.1.2/dist/ionicons/svg/ionicons.ttf') format('truetype'),
             url('https://cdnjs.cloudflare.com/ajax/libs/ionicons/7.1.2/fonts/ionicons.ttf') format('truetype');
        font-display: swap;
      }
      @font-face {
        font-family: 'Ionicons';
        src: url('https://cdn.jsdelivr.net/npm/ionicons@7.1.2/dist/ionicons/svg/ionicons.ttf') format('truetype'),
             url('https://cdnjs.cloudflare.com/ajax/libs/ionicons/7.1.2/fonts/ionicons.ttf') format('truetype');
        font-display: swap;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
